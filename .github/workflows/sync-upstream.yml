name: sync-upstream
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 https://github.com/JuliusBrussee/caveman.git /tmp/up
          rm -rf skills .claude-plugin src LICENSE
          mkdir -p skills src
          cp -r /tmp/up/.claude-plugin .
          for s in caveman caveman-review caveman-commit ultracave; do cp -r /tmp/up/skills/$s skills/; done
          cp -r /tmp/up/src/hooks src/
          cp /tmp/up/LICENSE .
          git config user.name sync-bot
          git config user.email sync-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "sync upstream" && git push)
